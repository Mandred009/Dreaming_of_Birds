# Dataset switch: 'mini' uses the top-level dataroot/version/out_dir/data below;
# 'trainval' uses the `trainval` block (dataset.dataset_cfg picks the right one).
dataset: trainval

# Paths (mini)
dataroot: ~/datasets/nuscenes
version: v1.0-mini
out_dir: ~/datasets/bev_cache_v2   # BEV cache (6-ch sparse + targets + ego pose), kept outside the repo
img_feat_dir: ~/datasets/bev_feat_v2   # frozen DINOv2 camera tokens (extract_image_features.py), one <token>_img.npz per frame

# BEV grid, ego frame (x forward, y left). Row 0 = far forward, col 0 = far left.
grid:
  size: 200          # cells per side
  resolution: 0.5    # metres per cell
  x_range: [-50.0, 50.0]
  y_range: [-50.0, 50.0]

# Sparse-BEV point filtering
points:
  stride: 4          # use every 4th pixel in u and v
  max_depth: 50.0    # metres
  z_range: [-1.0, 3.0]   # ego-frame height, drops ground noise below and sky/tall junk above

# Pretrained models (HuggingFace)
depth_model: depth-anything/Depth-Anything-V2-Metric-Outdoor-Large-hf
seg_model: nvidia/segformer-b2-finetuned-cityscapes-1024-1024

cameras: [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT, CAM_BACK, CAM_BACK_LEFT, CAM_BACK_RIGHT]

# Data split (by scene). train = mini_train minus val_scene; val = val_scene (model selection);
# test = mini_val (reported only). scene-0655 is daytime with the most vehicle pixels in mini_train,
# but few pedestrians (~10 px/frame), so val pedestrian IoU is noisy.
data:
  val_scene: scene-0655

# nuScenes v1.0-trainval, only the scenes whose camera images exist locally (blob parts 01-04).
# test = official val scenes available (reported only); val = seeded val_fraction of the available
# official-train scenes (model selection); train = the rest.
trainval:
  dataroot: ~/datasets/nuscenes_trainval
  version: v1.0-trainval
  out_dir: ~/datasets/bev_cache_trainval_v2
  img_feat_dir: ~/datasets/bev_feat_trainval_v2
  data:
    val_fraction: 0.08
    val_seed: 0

# Frozen image encoder for the hybrid DiT (extract_image_features.py)
img_features:
  model: facebook/dinov2-small
  image_hw: [224, 392]   # multiples of the ViT patch size 14 -> 16 x 28 patch tokens
  pool: 2                # 2x2 average pool -> 8 x 14 = 112 tokens per camera, 672 per frame

# U-Net baseline (6 sparse channels in, 6 independent (multi-label) map/object layers out)
unet:
  in_channels: 6
  num_classes: 6
  channels: [32, 64, 128, 256]   # width at each of the 4 levels

# Training
train:
  seed: 0
  epochs: 40 
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  warmup_epochs: 5
  patience: 8            # early stop if val mIoU has not improved for this many epochs
  num_workers: 2
  augment_flip: true     # left-right mirror of sparse + target (B and D only)
  dice_weight: 1.0       # loss = pos_weighted BCE + dice_weight * soft Dice (per layer)
  ckpt_dir: checkpoints/unet  
  log_dir: runs/unet

# Evaluation
eval:
  results_dir: results
  num_qualitative: 4

# Pixel-space conditional diffusion (model D): same U-Net backbone as B, trained from scratch.
# Input = concat(noisy layers [6ch], sparse BEV [6ch]); backbone widths come from `unet.channels`.
pixel_diffusion:
  T: 1000                  # number of training noise levels
  time_dim: 128            # size of the timestep embedding
  ddim_steps: 20           # sampling steps (validation and inference)
  num_samples: 4           # samples per frame for the "mean" row (sigmoid probabilities averaged)
  seed: 0
  epochs: 80 
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  warmup_epochs: 5
  val_every: 5             # epochs between validation runs (each is a full 20-step DDIM sampling)
  patience: 4              # early stop after this many validations without val mIoU improvement
  num_workers: 2
  ckpt_dir: checkpoints/pixel_diffusion
  log_dir: runs/pixel_diffusion

# Hybrid DiT (model F): diffusion transformer over 8x8 BEV patches, cross-attending to frozen DINOv2 camera tokens.
# Uses the same T / cosine schedule / DDIM / loss as `pixel_diffusion` (read from there), only the network differs.
dit:
  hidden: 384              # DiT-S
  depth: 12
  heads: 6
  patch: 8                 # 200 / 8 = 25 -> 25 x 25 = 625 BEV tokens
  use_sparse: true         # ablation: false = x_t only goes into the patch embedding
  use_cameras: true        # ablation: false = skip cross-attention (BEV-only DiT)
  epochs: 60 
  batch_size: 16
  grad_accum: 1
  lr: 0.0001
  weight_decay: 0.0
  warmup_steps: 1000
  ema_decay: 0.999
  val_every: 5
  num_workers: 2
  seed: 0
  ckpt_dir: checkpoints/dit
  log_dir: runs/dit
