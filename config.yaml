# Dataset switch: 'mini' uses the top-level dataroot/version/out_dir/data below (original behaviour);
# 'trainval' uses the `trainval` block (dataset.dataset_cfg picks the right one).
dataset: trainval

# Paths (mini)
dataroot: ~/datasets/nuscenes
version: v1.0-mini
out_dir: ~/datasets/bev_cache      # outside the repo: cache is ~hundreds of MB

# BEV grid, ego frame (x forward, y left). Row 0 = far forward, col 0 = far left.
grid:
  size: 200          # cells per side
  resolution: 0.5    # metres per cell
  x_range: [-50.0, 50.0]
  y_range: [-50.0, 50.0]

# Sparse-BEV point filtering
points:
  stride: 4          # use every 4th pixel in u and v
  max_depth: 50.0    # metres
  z_range: [-1.0, 3.0]   # ego-frame height, drops ground noise below and sky/tall junk above

# Pretrained models (HuggingFace)
depth_model: depth-anything/Depth-Anything-V2-Metric-Outdoor-Large-hf
seg_model: nvidia/segformer-b2-finetuned-cityscapes-1024-1024

cameras: [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT, CAM_BACK, CAM_BACK_LEFT, CAM_BACK_RIGHT]

# Data split (by scene). train = mini_train minus val_scene; val = val_scene (model selection);
# test = mini_val (reported only). scene-0655 is daytime with the most vehicle pixels in mini_train,
# but few pedestrians (~10 px/frame), so val pedestrian IoU is noisy.
data:
  val_scene: scene-0655

# nuScenes v1.0-trainval, only the scenes whose camera images exist locally (blob parts 01-04).
# test = official val scenes available (reported only); val = seeded val_fraction of the available
# official-train scenes (model selection); train = the rest.
trainval:
  dataroot: ~/datasets/nuscenes_trainval
  version: v1.0-trainval
  out_dir: ~/datasets/bev_cache_trainval
  data:
    val_fraction: 0.08
    val_seed: 0

# U-Net baseline
unet:
  in_channels: 4
  num_classes: 3
  channels: [32, 64, 128, 256]   # width at each of the 4 levels

# Training
train:
  seed: 0
  epochs: 100
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  warmup_epochs: 5
  patience: 25           # early stop if val mIoU has not improved for this many epochs
  num_workers: 2
  dice_weight: 1.0       # loss = weighted CE + dice_weight * soft Dice (foreground classes)
  ckpt_dir: checkpoints/unet
  log_dir: runs/unet

# Evaluation
eval:
  results_dir: results
  num_qualitative: 4

# Diffusion (model C): Stable Diffusion 1.5 + ControlNet. Only the ControlNet is trained.
diffusion:
  base_model: runwayml/stable-diffusion-v1-5
  prompt: "a bird's-eye-view semantic map"   # fixed, so no classifier-free guidance
  image_size: 256          # class map is resized 200 -> 256 so the VAE latent is 32x32
  seed: 0
  lr: 0.0001               # 1e-5 (usual ControlNet value) had not started using the control input after 2000 steps
  batch_size: 8
  grad_accum: 1
  shift_prob: 0.5          # augmentation: chance of shifting a frame by a multiple of 25 BEV cells
  point_keep_min: 0.5      # augmentation: each frame keeps a random 50-100% of its sparse points
  max_steps: 14000         # optimizer steps of the final run 
  eval_every: 1000
  ddim_steps: 25           # sampling steps used for validation and inference
  vote_samples: 4          # samples per frame for the majority-vote row
  ckpt_dir: checkpoints/diffusion
  log_dir: runs/diffusion

# Pixel-space conditional diffusion (model D, E4): same U-Net backbone as B, trained from scratch.
# Input = concat(noisy class map [3ch], sparse BEV [4ch]); backbone widths come from `unet.channels`.
pixel_diffusion:
  T: 1000                  # number of training noise levels
  time_dim: 128            # size of the timestep embedding
  ddim_steps: 20           # sampling steps (validation and inference)
  num_samples: 4           # samples per frame for the "mean" row (softmax probabilities averaged)
  seed: 0
  epochs: 300
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  warmup_epochs: 5
  val_every: 10            # epochs between validation runs (each is a full 20-step DDIM sampling)
  patience: 8              # early stop after this many validations without val mIoU improvement
  num_workers: 2
  ckpt_dir: checkpoints/pixel_diffusion
  log_dir: runs/pixel_diffusion
  # E5 (refiner): also feed B's softmax probabilities (3 more input channels). Off for E4. Enabled by
  # `train_pixel_diffusion.py --refiner`, which also switches to the two dirs below (E4 files untouched).
  condition_on_unet: false
  refiner_ckpt_dir: checkpoints/pixel_diffusion_refiner
  refiner_log_dir: runs/pixel_diffusion_refiner
